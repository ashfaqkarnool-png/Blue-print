<style id="final-blueprint-border-fix">
/* FINAL TARGETED BORDER FIX — does not change content or calculations */
.main-blueprint-wrapper {
  border: 2px solid #000 !important;
  border-radius: 0 !important;
  overflow: visible !important;
}
.main-blueprint-wrapper .bp-table {
  border: 2px solid #000 !important;
  border-collapse: collapse !important;
  border-spacing: 0 !important;
}
.main-blueprint-wrapper .bp-table th,
.main-blueprint-wrapper .bp-table td {
  border: 1px solid #000 !important;
}
/* Appreciation → Total Marks divider on live screen and print */
.main-blueprint-wrapper .bp-table thead tr:first-child th:nth-child(6) {
  border-right: 1px solid #000 !important;
}
.main-blueprint-wrapper .bp-table thead tr:first-child th:nth-child(7),
.main-blueprint-wrapper .bp-table tbody tr > td:nth-child(15),
.main-blueprint-wrapper .bp-table tfoot tr > td:nth-child(15) {
  border-left: 1px solid #000 !important;
}
/* Make the Appreciation → Total Marks divider match the normal 1px internal grid lines */
.main-blueprint-wrapper .bp-table thead tr:first-child th:nth-child(6),
.main-blueprint-wrapper .bp-table thead tr:first-child th:nth-child(7) {
  border-right: 1px solid #000 !important;
  border-left: 1px solid #000 !important;
  box-shadow: none !important;
}
/* Keep the divider continuous through Appreciation's three sub-columns */
.main-blueprint-wrapper .bp-table thead tr:nth-child(2) th:nth-child(12),
.main-blueprint-wrapper .bp-table thead tr:nth-child(2) th:nth-child(11),
.main-blueprint-wrapper .bp-table thead tr:nth-child(2) th:nth-child(10) {
  border-right: 1px solid #000 !important;
}
@media print {
  .main-blueprint-wrapper { border: 2px solid #000 !important; }
  .main-blueprint-wrapper .bp-table { border: 2px solid #000 !important; }
  .main-blueprint-wrapper .bp-table th,
  .main-blueprint-wrapper .bp-table td { border: 1px solid #000 !important; }
  .main-blueprint-wrapper .bp-table thead tr:first-child th:nth-child(6),
  .main-blueprint-wrapper .bp-table thead tr:first-child th:nth-child(7),
  .main-blueprint-wrapper .bp-table tbody tr > td:nth-child(15) { border-left: 1px solid #000 !important; border-right: 1px solid #000 !important; }
}
</style>
